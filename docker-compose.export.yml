  core-win:
    build:
      context: ..
      dockerfile: Core/Dockerfile.cmake
      args:
        BASE_DEPS_IMAGE: base-deps-win:latest
        CMAKE_CMD: i686-w64-mingw32-cmake
        CORE_INSTALL_BASE: /app/Core/applocal-staging
    image: core-builder-cmake-win:latest
    volumes:
      - ${OUT_ROOT:?OUT_ROOT must be set}/win:/out
    command: >
      sh -c "set -e
             cmake --install /app/Core/build --prefix /app/Core/applocal-staging/${CORE_VERSION:?CORE_VERSION must be set}
             rm -rf /out/*
             cp -r /app/Core/applocal-staging/${CORE_VERSION:?CORE_VERSION must be set}/* /out/"