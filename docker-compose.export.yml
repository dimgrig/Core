# docker-compose.export.yml
# Dev-экспорт артефактов Core из контейнеров в ${OUT_ROOT}/{linux,arm64,armv7,win}.
# НЕ для продакшена: prod-путь — CI → Core-SDK releases.
#
# Требует env: CORE_VERSION (из VERSION), OUT_ROOT (см. docker-export-core.sh).
# Прямой запуск:
#   CORE_VERSION=$(tr -d '[:space:]' < VERSION) \
#   OUT_ROOT=$HOME/deploy/core/${CORE_VERSION} \
#   docker compose -f docker-compose.export.yml run --rm core-linux

services:
  core-linux:
    build:
      context: ..
      dockerfile: Core/Dockerfile.cmake
      args:
        BASE_DEPS_IMAGE: base-deps-linux:latest
        CMAKE_CMD: cmake
        CORE_INSTALL_BASE: /opt/core
    image: core-builder-cmake-linux:latest
    volumes:
      - ${OUT_ROOT:?OUT_ROOT must be set}/linux:/out
    command: >
      sh -c "rm -rf /out/* && cp -r /opt/core/${CORE_VERSION:?CORE_VERSION must be set}/* /out/"

