name: Build and Release Core SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.1.0)'
        required: true
      build_qt5:
        description: 'Also build Qt5 legacy (linux-qt5 win-qt5 arm64-qt5 armv7-qt5)'
        type: boolean
        default: false
      build_arm64_qt6:
        description: 'Also build arm64 Qt6'
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms_qt6: ${{ steps.p.outputs.qt6 }}
      platforms_qt5: ${{ steps.p.outputs.qt5 }}
    steps:
      - id: p
        shell: bash
        run: |
          qt6="linux-qt6 win-qt6"
          qt5=""

          if [ "${{ github.event_name }}" == "push" ]; then
            # На пуш тега v* — полный Qt6 набор (как было в старом workflow).
            qt6="$qt6 arm64-qt6"
          else
            # workflow_dispatch: arm64 Qt6 — по чекбоксу (default true).
            [ "${{ inputs.build_arm64_qt6 }}" == "true" ] && qt6="$qt6 arm64-qt6"
            # Qt5 — только если явно включили.
            if [ "${{ inputs.build_qt5 }}" == "true" ]; then
              qt5="linux-qt5 win-qt5 arm64-qt5 armv7-qt5"
            fi
          fi

          echo "qt6=$(echo "$qt6" | xargs)" >> "$GITHUB_OUTPUT"
          echo "qt5=$(echo "$qt5" | xargs)" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    uses: dimgrig/CoreCI/.github/workflows/release-template.yml@master
    with:
      app_name: core
      release_title: Core SDK
      # Для Core самого core_sdk_version не нужен (он сам SDK).
      # Оставляем default из шаблона (1.1.0) — попадает в --build-arg CORE_SDK_VERSION,
      # который Dockerfile.core игнорирует. Безвредно.
      platforms_qt6: ${{ needs.prepare.outputs.platforms_qt6 }}
      platforms_qt5: ${{ needs.prepare.outputs.platforms_qt5 }}
      upload_artifacts: true
      publish_release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read