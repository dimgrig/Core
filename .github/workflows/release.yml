name: Build and Release Core SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.1.0)'
        required: true
      build_arm:
        description: 'Also build ARM (slow; armv7 via QEMU)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  QT_MAJOR: 5

jobs:
  # ────────────────────────────────────────────
  # 0. Verify VERSION matches tag
  # ────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION == tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG, VERSION=$FILE_VER"
          if [ "v${FILE_VER}" != "${TAG}" ]; then
            echo "ERROR: tag '${TAG}' does not match VERSION '${FILE_VER}'" >&2
            exit 1
          fi

  # ────────────────────────────────────────────
  # 1. Linux amd64
  # ────────────────────────────────────────────
  build-linux-amd64:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & export SDK
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/linux-amd64 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-linux:qt5-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-amd64 \
            --cache-to   type=gha,mode=max,scope=core-linux-amd64 \
            -f Dockerfile.core .
      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-amd64-qt${QT_MAJOR}.tar.gz" -C out/linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-amd64
          path: dist/*.tar.gz

  # ────────────────────────────────────────────
  # 2. Windows x32 (cross-compiled on amd64)
  # ────────────────────────────────────────────
  build-win32:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & export SDK
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/win32 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-win:qt5-mingw \
            --build-arg CMAKE_CMD=i686-w64-mingw32-cmake \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-win32 \
            --cache-to   type=gha,mode=max,scope=core-win32 \
            -f Dockerfile.core .
      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          (cd out/win32 && zip -r "../../dist/Core-Releases-${VERSION}-win32-qt${QT_MAJOR}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-win32
          path: dist/*.zip

  # ────────────────────────────────────────────
  # 3. Linux arm64 — native ARM runner
  # ────────────────────────────────────────────
  build-linux-arm64:
    if: github.event.inputs.build_arm == 'true'
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & export SDK
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/linux-arm64 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-arm64:qt5-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-arm64 \
            --cache-to   type=gha,mode=max,scope=core-linux-arm64 \
            -f Dockerfile.core .
      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-arm64-qt${QT_MAJOR}.tar.gz" -C out/linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-arm64
          path: dist/*.tar.gz

  # ────────────────────────────────────────────
  # 4. Linux armv7 — QEMU (slow)
  # ────────────────────────────────────────────
  build-linux-armv7:
    if: github.event.inputs.build_arm == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & export SDK
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --target export \
            --output type=local,dest=out/linux-armv7 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-armv7:qt5-bullseye \
            --build-arg CMAKE_CMD=cmake \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-armv7 \
            --cache-to   type=gha,mode=max,scope=core-linux-armv7 \
            -f Dockerfile.core .
      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-armv7-qt${QT_MAJOR}.tar.gz" -C out/linux-armv7 .
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-armv7
          path: dist/*.tar.gz

  # ────────────────────────────────────────────
  # 5. Tests on linux amd64 (parallel with builds)
  # ────────────────────────────────────────────
  test-linux:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with tests & run ctest
        run: |
          docker buildx build \
            --target test \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-linux:qt5-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --cache-from type=gha,scope=core-linux-amd64 \
            --cache-from type=gha,scope=core-linux-tests \
            --cache-to   type=gha,mode=max,scope=core-linux-tests \
            -f Dockerfile.core .

  # ────────────────────────────────────────────
  # 6. Publish release
  # ────────────────────────────────────────────
  publish:
    needs: [build-linux-amd64, build-win32, test-linux, build-linux-arm64, build-linux-armv7]
    if: |
      !cancelled() &&
      needs.build-linux-amd64.result == 'success' &&
      needs.build-win32.result     == 'success' &&
      needs.test-linux.result      == 'success' &&
      (needs.build-linux-arm64.result == 'success' || needs.build-linux-arm64.result == 'skipped') &&
      (needs.build-linux-armv7.result == 'success' || needs.build-linux-armv7.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/
      - name: SHA256SUMS
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Core ${{ steps.tag.outputs.tag }}
          body: |
            ## Core SDK — ${{ steps.tag.outputs.tag }}

            Qt${{ env.QT_MAJOR }} build. Archives contain `include/`, `lib/`, `lib/cmake/Core/`.

            ### Usage (CMake)
            ```cmake
            find_package(Core CONFIG REQUIRED)
            target_link_libraries(app PRIVATE Core::core-lib Core::core-modbus-lib)