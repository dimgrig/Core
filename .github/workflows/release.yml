name: Build and Release Core SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.1.0)'
        required: true
      build_linux_amd64_qt5:
        description: 'Also build Qt5 legacy (linux-amd64-qt5)'
        type: boolean
        default: false
      build_win32_qt5:
        description: 'Also build Qt5 legacy (win32-qt5)'
        type: boolean
        default: false        
      build_linux_arm64_qt5:
        description: 'Also build Qt5 legacy (linux-arm64-qt5)'
        type: boolean
        default: false
      build_linux_armv7_qt5:
        description: 'Also build Qt5 armv7 (linux-armv7-qt5)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION == tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG, VERSION=$FILE_VER"
          if [ "v${FILE_VER}" != "${TAG}" ]; then
            echo "ERROR: tag '${TAG}' does not match VERSION '${FILE_VER}'" >&2
            exit 1
          fi

  # ════════════════════════════════════════════
  # PRIMARY: Qt6 (always)
  # ════════════════════════════════════════════

  build-linux-amd64-qt6:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 6
      QT6_PREFIX: /opt/Qt/6.8.0/gcc_64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt6)
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/linux-amd64-qt6 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-linux:qt6-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=6 \
            --build-arg QT6_INSTALL_PREFIX=${QT6_PREFIX} \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-amd64-qt6 \
            --cache-to   type=gha,mode=max,scope=core-linux-amd64-qt6 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-amd64-qt6.tar.gz" \
            -C out/linux-amd64-qt6 .

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-amd64-qt6
          path: dist/*.tar.gz

  build-win64-qt6:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 6
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt6 win64)
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/win64-qt6 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-win64:qt6-mingw \
            --build-arg CMAKE_CMD=cmake \
            --build-arg CMAKE_TOOLCHAIN_FILE=/opt/x86_64-w64-mingw32.cmake \
            --build-arg QT_VERSION_MAJOR=6 \
            --build-arg QT6_INSTALL_PREFIX=/opt/Qt/6.8.0/mingw_64 \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-win64-qt6 \
            --cache-to   type=gha,mode=max,scope=core-win64-qt6 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          (cd out/win64-qt6 && zip -r "../../dist/Core-Releases-${VERSION}-win64-qt6.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-win64-qt6
          path: dist/*.zip

  build-linux-arm64-qt6:
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 6
      QT6_PREFIX: /opt/Qt/6.8.5/gcc_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt6 arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --target export \
            --output type=local,dest=out/linux-arm64-qt6 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-arm64:qt6-bookworm-aqt \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=6 \
            --build-arg QT6_INSTALL_PREFIX=${QT6_PREFIX} \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-arm64-qt6 \
            --cache-to   type=gha,mode=max,scope=core-linux-arm64-qt6 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-arm64-qt6.tar.gz" \
            -C out/linux-arm64-qt6 .

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-arm64-qt6
          path: dist/*.tar.gz

  # ════════════════════════════════════════════
  # TESTS (Qt6, always)
  # ════════════════════════════════════════════
  test-linux-qt6:
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & run ctest (Qt6)
        run: |
          docker buildx build \
            --target test \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-linux:qt6-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=6 \
            --build-arg QT6_INSTALL_PREFIX=/opt/Qt/6.8.0/gcc_64 \
            --cache-from type=gha,scope=core-linux-amd64-qt6 \
            --cache-from type=gha,scope=core-linux-tests-qt6 \
            --cache-to   type=gha,mode=max,scope=core-linux-tests-qt6 \
            -f Dockerfile.core .

  build-linux-amd64-qt5:
    if: github.event.inputs.build_linux_amd64_qt5 == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt5)
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/linux-amd64-qt5 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-linux:qt5-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=5 \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-amd64-qt5 \
            --cache-to   type=gha,mode=max,scope=core-linux-amd64-qt5 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-amd64-qt5.tar.gz" \
            -C out/linux-amd64-qt5 .

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-amd64-qt5
          path: dist/*.tar.gz

  build-win32-qt5:
    if: github.event.inputs.build_win32_qt5 == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt5 win32)
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=out/win32-qt5 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-win:qt5-mingw \
            --build-arg CMAKE_CMD=i686-w64-mingw32-cmake \
            --build-arg QT_VERSION_MAJOR=5 \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-win32-qt5 \
            --cache-to   type=gha,mode=max,scope=core-win32-qt5 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          (cd out/win32-qt5 && zip -r "../../dist/Core-Releases-${VERSION}-win32-qt5.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-win32-qt5
          path: dist/*.zip

  build-linux-arm64-qt5:
    if: github.event.inputs.build_linux_arm64_qt5 == 'true'
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt5 arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --target export \
            --output type=local,dest=out/linux-arm64-qt5 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-arm64:qt5-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=5 \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-arm64-qt5 \
            --cache-to   type=gha,mode=max,scope=core-linux-arm64-qt5 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-arm64-qt5.tar.gz" \
            -C out/linux-arm64-qt5 .

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-arm64-qt5
          path: dist/*.tar.gz

  build-linux-armv7-qt5:
    if: github.event.inputs.build_linux_armv7_qt5 == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    env:
      QT_MAJOR: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & export SDK (Qt5 armv7)
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --target export \
            --output type=local,dest=out/linux-armv7-qt5 \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-armv7:qt5-bullseye \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=5 \
            --build-arg BUILD_TESTING=OFF \
            --cache-from type=gha,scope=core-linux-armv7-qt5 \
            --cache-to   type=gha,mode=max,scope=core-linux-armv7-qt5 \
            -f Dockerfile.core .

      - name: Package
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          tar -czf "dist/Core-Releases-${VERSION}-linux-armv7-qt5.tar.gz" \
            -C out/linux-armv7-qt5 .

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-linux-armv7-qt5
          path: dist/*.tar.gz

  test-linux-qt5:
    if: github.event.inputs.build_linux_amd64_qt5 == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & run ctest (Qt5)
        run: |
          docker buildx build \
            --target test \
            --build-arg BASE_DEPS_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-linux:qt5-bookworm \
            --build-arg CMAKE_CMD=cmake \
            --build-arg QT_VERSION_MAJOR=5 \
            --cache-from type=gha,scope=core-linux-amd64-qt5 \
            --cache-from type=gha,scope=core-linux-tests-qt5 \
            --cache-to   type=gha,mode=max,scope=core-linux-tests-qt5 \
            -f Dockerfile.core .

  # ════════════════════════════════════════════
  # PUBLISH
  # ════════════════════════════════════════════
  publish:
    needs:
      - build-linux-amd64-qt6
      - build-win64-qt6
      - build-linux-arm64-qt6
      - test-linux-qt6
      - build-linux-amd64-qt5
      - build-win32-qt5
      - build-linux-arm64-qt5
      - build-linux-armv7-qt5
      - test-linux-qt5
    if: |
      !cancelled() &&
      needs.build-linux-amd64-qt6.result == 'success' &&
      needs.build-win64-qt6.result      == 'success' &&
      needs.build-linux-arm64-qt6.result == 'success' &&
      needs.test-linux-qt6.result       == 'success' &&
      (needs.build-linux-amd64-qt5.result == 'success' || needs.build-linux-amd64-qt5.result == 'skipped') &&
      (needs.build-win32-qt5.result       == 'success' || needs.build-win32-qt5.result       == 'skipped') &&
      (needs.build-linux-arm64-qt5.result == 'success' || needs.build-linux-arm64-qt5.result == 'skipped') &&
      (needs.build-linux-armv7-qt5.result == 'success' || needs.build-linux-armv7-qt5.result == 'skipped') &&
      (needs.test-linux-qt5.result        == 'success' || needs.test-linux-qt5.result        == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: SHA256SUMS
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Core ${{ steps.tag.outputs.tag }}
          body: |
            ## Core SDK — ${{ steps.tag.outputs.tag }}

            **Primary: Qt6.8** (Core SDK `${{ github.ref_name }}`).
            Qt5.15 — legacy, собирается только с `build_*=true`.

            ### Artifacts (Qt6)
            - `Core-Releases-*-linux-amd64-qt6.tar.gz`  — Linux x86_64, Qt6.8
            - `Core-Releases-*-win64-qt6.zip`           — Windows x64 (MinGW), Qt6.8
            - `Core-Releases-*-linux-arm64-qt6.tar.gz`  — Linux arm64, Qt6.8

            ### Artifacts (Qt5)
            - `Core-Releases-*-linux-amd64-qt5.tar.gz`  — Linux x86_64, Qt5
            - `Core-Releases-*-win32-qt5.zip`           — Windows x32 (MinGW), Qt5
            - `Core-Releases-*-linux-arm64-qt5.tar.gz`  — Linux arm64, Qt5
            - `Core-Releases-*-linux-armv7-qt5.tar.gz`  — Linux armv7, Qt5

            ### Usage (CMake)
            ```cmake
            find_package(Core CONFIG REQUIRED)
            target_link_libraries(app PRIVATE Core::core-lib Core::core-modbus-lib)
            ```
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: false