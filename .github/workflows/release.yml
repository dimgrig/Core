name: Build and Release Core SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.1.0)'
        required: true
      build_linux_amd64_qt5:
        description: 'Also build Qt5 legacy (linux-amd64-qt5)'
        type: boolean
        default: false
      build_win32_qt5:
        description: 'Also build Qt5 legacy (win32-qt5)'
        type: boolean
        default: false
      build_linux_arm64_qt5:
        description: 'Also build Qt5 legacy (linux-arm64-qt5)'
        type: boolean
        default: false
      build_linux_armv7_qt5:
        description: 'Also build Qt5 armv7 (linux-armv7-qt5)'
        type: boolean
        default: false
      build_wasm_qt6:
        description: 'Also build WebAssembly (wasm-qt6)'
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms_qt6: ${{ steps.p.outputs.qt6 }}
      platforms_qt5: ${{ steps.p.outputs.qt5 }}
    steps:
      - id: p
        shell: bash
        run: |
          # Qt6 — всегда полный набор (как раньше).
          qt6="linux-qt6 win-qt6 arm64-qt6"
          qt5=""

          # Qt5 — по чекбоксам (только workflow_dispatch).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.build_linux_amd64_qt5 }}" = "true" ] && qt5="$qt5 linux-qt5"
            [ "${{ inputs.build_win32_qt5 }}"       = "true" ] && qt5="$qt5 win-qt5"
            [ "${{ inputs.build_linux_arm64_qt5 }}" = "true" ] && qt5="$qt5 arm64-qt5"
            [ "${{ inputs.build_linux_armv7_qt5 }}" = "true" ] && qt5="$qt5 armv7-qt5"
            [ "${{ inputs.build_wasm_qt6 }}"        = "true" ] && qt6="$qt6 wasm-qt6"
          fi

          echo "qt6=$(echo "$qt6" | xargs)" >> "$GITHUB_OUTPUT"
          echo "qt5=$(echo "$qt5" | xargs)" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    uses: dimgrig/CoreCI/.github/workflows/release-template.yml@master
    with:
      app_name: core
      release_title: Core SDK
      core_sdk_version: ${{ github.event.inputs.tag && '' || '' }}  # не используется для самого Core
      platforms_qt6: ${{ needs.prepare.outputs.platforms_qt6 }}
      platforms_qt5: ${{ needs.prepare.outputs.platforms_qt5 }}
      upload_artifacts: true
      publish_release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read