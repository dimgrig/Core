name: Build base-deps images

on:
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile.base-deps-*'
      - '.github/workflows/base-deps.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-base-deps:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux
            dockerfile: Dockerfile.base-deps-linux
            tag: qt5-bookworm
            runner: ubuntu-latest
            platforms: linux/amd64
          - plat: win
            dockerfile: Dockerfile.base-deps-win
            tag: qt5-mingw
            runner: ubuntu-latest
            platforms: linux/amd64
          - plat: arm64
            dockerfile: Dockerfile.base-deps-arm64
            tag: qt5-bookworm
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
          - plat: armv7
            dockerfile: Dockerfile.base-deps-armv7
            tag: qt5-bullseye
            runner: ubuntu-latest
            platforms: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch only)
        if: matrix.platforms != 'linux/amd64' && matrix.runner != 'ubuntu-24.04-arm'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/core-base-deps-${{ matrix.plat }}:${{ matrix.tag }}
          cache-from: type=gha,scope=base-deps-${{ matrix.plat }}
          cache-to:   type=gha,mode=max,scope=base-deps-${{ matrix.plat }}
  build-innosetup-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.innosetup-base
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/innosetup-base:latest
          cache-from: type=gha,scope=innosetup-base
          cache-to:   type=gha,mode=max,scope=innosetup-base